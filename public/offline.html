<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Qaras Hospitality Solutions</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #f7f7f7;
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 40px 20px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #1e3a8a;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      background-color: #1e3a8a;
      color: white;
      padding: 12px 24px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #1e4fad;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/assets/icons/offline.png" alt="Offline" class="icon">
    <h1>You are offline</h1>
    <p>It looks like you're currently offline. Don't worry - many features of Qaras Hospitality Solutions still work offline.</p>
    <p>You can continue managing bookings and check-ins. All changes will be synchronized when you're back online.</p>
    <a href="/" class="btn">Try again</a>
  </div>
</body>
</html>
