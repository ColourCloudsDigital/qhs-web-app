version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: qaras-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DATABASE_NAME:-qaras_hotel}
      MYSQL_USER: ${DATABASE_USER:-qaras_user}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-qaras_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./qaras_combined.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    image: qaras-hotel:latest
    container_name: qaras-app
    restart: unless-stopped
    ports:
      - "8080:3000"  # Changed to port 8080 to avoid conflicts
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - DATABASE_USER=${DATABASE_USER:-qaras_user}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-qaras_password}
      - DATABASE_NAME=${DATABASE_NAME:-qaras_hotel}
      - DATABASE_URL=mysql://${DATABASE_USER:-qaras_user}:${DATABASE_PASSWORD:-qaras_password}@db:3306/${DATABASE_NAME:-qaras_hotel}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-l0m0KCL2yPg6gza4A44UAxSntiPMaFdnrJuR9ATTpY8=}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
      - DB_HOST=db
      - DB_USER=${DATABASE_USER:-qaras_user}
      - DB_PASSWORD=${DATABASE_PASSWORD:-qaras_password}
      - DB_NAME=${DATABASE_NAME:-qaras_hotel}
      - DB_PORT=3306
      # Optional: Email Configuration
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Optional: Payment Gateway
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY:-}
      - FLUTTERWAVE_SECRET_KEY=${FLUTTERWAVE_SECRET_KEY:-}
      - FLUTTERWAVE_PUBLIC_KEY=${FLUTTERWAVE_PUBLIC_KEY:-}
      # PWA
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-info@qarashotels.com}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mysql_data:
    driver: local
