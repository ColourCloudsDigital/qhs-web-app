services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: qaras-hotel:latest
    container_name: qaras-app
    restart: unless-stopped
    ports:
      - "8080:3000"
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=${DATABASE_HOST:-localhost}
      - DATABASE_PORT=${DATABASE_PORT:-3306}
      - DATABASE_USER=${DATABASE_USER:-qaras_user}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-qaras_password}
      - DATABASE_NAME=${DATABASE_NAME:-qaras_hotel}
      - DATABASE_URL=${DATABASE_URL:-mysql://qaras_user:qaras_password@localhost:3306/qaras_hotel}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:8080}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-l0m0KCL2yPg6gza4A44UAxSntiPMaFdnrJuR9ATTpY8=}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
      - DB_HOST=${DB_HOST:-localhost}
      - DB_USER=${DB_USER:-qaras_user}
      - DB_PASSWORD=${DB_PASSWORD:-qaras_password}
      - DB_NAME=${DB_NAME:-qaras_hotel}
      - DB_PORT=${DB_PORT:-3306}
      # Optional: Email Configuration
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Optional: Payment Gateway
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY:-}
      - FLUTTERWAVE_SECRET_KEY=${FLUTTERWAVE_SECRET_KEY:-}
      - FLUTTERWAVE_PUBLIC_KEY=${FLUTTERWAVE_PUBLIC_KEY:-}
      # PWA
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-info@qarashotels.com}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
